name: Production CI/CD Deploy (Systemd)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Build and compress static production binary
        run: |
          sudo apt-get install -y upx-ucl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o bin/recallo ./cmd/api
          upx --best --lzma bin/recallo

      - name: Copy binary to DigitalOcean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: bin/recallo
          target: /opt/recallo/bin/
          strip_components: 1

      - name: Reload application process via Systemd
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/recallo
            chmod +x bin/recallo
            
            # Restart via systemd (deploy user needs NOPASSWD sudo access for this command)
            sudo systemctl restart recallo-api
            
            # Verify it stayed up
            sleep 3
            systemctl is-active --quiet recallo-api || exit 1

      - name: Post-deployment HTTP health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Performing local and public boundary checks..."

            echo "Testing backend locally on internal port..."
            curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8080/api/v1/healthcheck

            echo "HTTP health check internally passed successfully!"

            # 2. Public network route verification (HTTPS through Nginx/Certbot)
            # Agar DNS propagation done hai aur Nginx reverse proxy set hai tabhi ye execute hoga
            echo "Performing external SSL route check against https://${{ secrets.DOMAIN }}/api/v1/healthcheck..."
            curl -f --retry 5 --retry-delay 3 --retry-all-errors https://${{ secrets.DOMAIN }}/api/v1/healthcheck

            echo "All routes deployed successfully! 🔥"
