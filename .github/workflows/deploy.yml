name: Production CI/CD Deploy (PMGo)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit & integration tests
        run: go test -v ./...

      - name: Build static production binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -trimpath -o bin/recallo ./cmd/api

      - name: Copy binary to DigitalOcean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: bin/recallo
          target: /opt/recallo/bin/
          strip_components: 1

      - name: Reload application process via PMGo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/local/go/bin:$HOME/go/bin

            pmgo stop recallo-api || true
            pmgo delete recallo-api || true

            cd /opt/recallo
            chmod +x bin/recallo
            pmgo start ./bin/recallo recallo-api
            pmgo save

            sleep 3
            pmgo list | grep -q "recallo-api" || exit 1

      - name: Post-deployment HTTP health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Performing local and public boundary checks..."

            echo "Testing backend locally on internal port..."
            curl -f --retry 3 --retry-delay 2 http://127.0.0.1:8080/api/v1/healthcheck

            echo "HTTP health check internally passed successfully!"

            # 2. Public network route verification (HTTPS through Nginx/Certbot)
            # Agar DNS propagation done hai aur Nginx reverse proxy set hai tabhi ye execute hoga
            echo "Performing external SSL route check against https://${{ secrets.DOMAIN }}/api/v1/healthcheck..."
            curl -f --retry 5 --retry-delay 3 --retry-all-errors https://${{ secrets.DOMAIN }}/api/v1/healthcheck

            echo "All routes deployed successfully! 🔥"
